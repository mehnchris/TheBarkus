<!doctype html><html lang="en"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#fffaf2;color:#0b1e3b;font:16px/1.6 Arial,sans-serif}form{max-width:620px;margin:auto}label{display:block;margin-bottom:20px;font-weight:600}small{display:block;font-weight:400;color:#536174}input:not([type=radio]),textarea{display:block;width:100%;padding:12px;border:1px solid #9aa3b0;border-radius:9px;background:white;color:#0b1e3b;font:inherit;margin-top:7px}fieldset{border:0;padding:0;margin:0 0 20px}legend{font-weight:600;margin-bottom:10px}.choices{display:flex;gap:16px;flex-wrap:wrap}.choices label{padding:10px 14px;border:1px solid #9aa3b0;border-radius:9px;font-weight:400;margin:0}input[type=radio]{accent-color:#0b1e3b}button{border:0;border-radius:99px;background:#0b1e3b;color:#fff9ed;padding:15px 26px;min-height:48px;font:600 16px Arial;cursor:pointer}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #b51049;outline-offset:3px}.privacy{font-size:13px;color:#536174}.honeypot{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}[hidden]{display:none!important}#form-status{font-weight:600}label>span,legend>span{color:#a21840}
.rsvp{display:block;padding:0}.form-grid{display:block}</style></head><body><div class="rsvp"><form id="rsvp-form"><div class="form-grid"><label>Full name <span>*</span><input name="name" autocomplete="name" required maxlength="120"></label><label>Email address <span>*</span><input name="email" type="email" autocomplete="email" required maxlength="254"></label></div><fieldset><legend>Will you be celebrating with us? <span>*</span></legend><div class="choices"><label><input type="radio" name="attending" value="yes" required> Joyfully accepts</label><label><input type="radio" name="attending" value="no" required> Regretfully declines</label></div></fieldset><label id="plus-one-field">Plus-one name <small>If included on your invitation</small><input name="plusOne" maxlength="120" autocomplete="off"></label><label id="song-field">A song to get you on the dance floor<input name="song" maxlength="200" placeholder="Song title & artist"></label><label>A little note for us<textarea name="note" rows="3" maxlength="2000" placeholder="We’d love to hear from you."></textarea></label><div class="honeypot" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><button class="button" type="submit">Send our RSVP <span aria-hidden="true">↗</span></button><p class="privacy">Your response is stored privately for the couple.</p><p id="form-status" role="status" aria-live="polite"></p></form></div><script>const form = document.querySelector('#rsvp-form');
const status = document.querySelector('#form-status');
const button = form.querySelector('button[type=submit]');
let requestId = crypto.randomUUID();
let pending = false;
form.addEventListener('change', () => {
  const declined = form.elements.attending.value === 'no';
  for (const [id,name] of [['plus-one-field','plusOne'],['song-field','song']]) {
    document.getElementById(id).hidden = declined;
    form.elements[name].disabled = declined;
  }
});
form.addEventListener('submit', event => {
  event.preventDefault();
  if (pending) return;
  if (!window.google?.script?.run) { status.textContent = 'This form must be opened through the wedding website. Please reload and try again.'; return; }
  pending = true; button.disabled = true;
  status.textContent = 'Saving your RSVP…';
  const payload = {...Object.fromEntries(new FormData(form)),requestId};
  const timeout = setTimeout(() => { status.textContent = 'Google is taking longer than usual. Please wait for confirmation. If you need to reload, check with the couple before sending another response.'; },20000);
  function finish() { clearTimeout(timeout); pending=false; button.disabled=false; }
  google.script.run.withSuccessHandler(result => {
    finish();
    if (!result || result.ok !== true) { status.textContent = result?.message || 'We couldn’t confirm your RSVP. Please try again.'; return; }
    status.textContent = result.message;
    form.reset(); form.dispatchEvent(new Event('change')); requestId=crypto.randomUUID();
  }).withFailureHandler(() => {
    finish(); status.textContent = 'We couldn’t confirm your RSVP. Please retry; the same request will not be saved twice.';
  }).submitRsvp(payload);
});
</script></body></html>
